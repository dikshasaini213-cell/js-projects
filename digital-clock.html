<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>digital clock</title>
  <style>
    .box{
      border: 2px black solid;
      border-radius: 20px;
      height: 300px;
      width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-self: center;
      padding: 15px;
      margin-top: 150px;
    }
    #clock{
      font-size: 30px;
      font-weight: bold;
      margin-top: 90px;
    }
    #stop{
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <p id="clock"></p>
    <button id="stop">Stop the clock</button>
  </div>
  <script>
   let time=setInterval(()=>{
    document.getElementById("clock").innerHTML=new Date().toLocaleTimeString();
   },1000)

   let stop=document.querySelector("#stop");
   stop,addEventListener("click",()=>{
    setTimeout(()=>{
      clearInterval(time);
    })
   },1000)
  </script>
</body>
</html>
