<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bmi claculator</title>
  <style>
    
  
    .box{
      height: 400px;
      width: 300px;
      border: 1px black solid;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-self: center;
      margin-top: 120px;
    }
    p{
      font-size: 18px;
      font-weight: bold;
    }
    #height{
      margin: 40px 5px 10px 5px;
      width: 200px;
      font-size: 17px;
    }
    #weight{
      margin: 20px 10px;
      width: 200px;
      font-size: 17px;
    }
    #bmi{
      font-size: 17px;
      margin: 15px;
    }
    /* h1{
      display: flex;
      justify-self: center;
    } */
  </style>
</head>
<body>
  
  <div class="box">
    <h1>BMI Calculator</h1>
  <input type="text" id="height" placeholder="enter your height">
  <input type="text"  id="weight" placeholder="enter your weight">
  <button onclick="calc()" id="bmi">Calculate bmi</button>
  <p id="result"></p>
  <p id="report"></p>
  </div>
  <script>
    function calc(){
      let h=Number(document.getElementById("height").value);
      let w=Number(document.getElementById("weight").value);
      h=h/100;
      let bmi=w/(h*h);
      document.getElementById("result").innerHTML="your bmi is " + bmi.toFixed(2);
      if(bmi<18.5){
        document.getElementById("report").innerHTML="underweight";
      }
      else if(bmi<25){
        document.getElementById("report").innerHTML="normal";
      }
      else if(bmi<30){
        document.getElementById("report").innerHTML="overweight";
      }
      else{
        document.getElementById("report").innerHTML="obese";
      }
    }
  </script>
</body>
</html>
