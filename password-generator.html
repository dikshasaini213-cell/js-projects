<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>password generator</title>
  <style>
    .box{
      border: 2px black solid;
      border-radius: 20px;
      height: 250px;
      width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-self: center;
      padding-top: 150px;
      margin-top: 150px;
    }
      button{
        font-size: 18px;
      }
      p{
        font-size: 18px;
        font-weight: bold;
      }
  </style>
</head>
<body>
  <div class="box">
  <button onclick="password()">Generate password</button>
  <p id="result"></p>
  </div>
  <script>
    function password(){
      let pass="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz1234567890!@#$%^&*";
      let pw="";
      for(let i=0;i<8;i++){
      let random=Math.floor(Math.random()*pass.length);
      pw+=pass[random];
      }
      document.getElementById("result").innerHTML=pw;
    }
  </script>
</body>
</html>
