<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>counter</title>
  <style>
    .box{
      border: 2px black solid;
      border-radius: 20px;
      height: 250px;
      width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-self: center;
      padding-top: 100px;
      margin-top: 150px;
    }
    button{
      margin: 15px;
      font-size: 16px;
    }
    #result{
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 25px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div id="result"></div>
    <button onclick="count()">Start counting</button>
    <button onclick="reset()">Reset count</button>
  </div>
  <script>
    let counter=0;
    function count(){
    let result=document.getElementById("result");
    counter++;
    result.innerHTML=counter;
  }
  function reset(){
    let result=document.getElementById("result");
    counter=0;
    result.innerHTML=counter;
  }
  </script>
</body>
</html>
