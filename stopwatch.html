<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stopwatch</title>
  <style>
    .box{
      border: 2px black solid;
      border-radius: 20px;
      height: 250px;
      width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-self: center;
      padding-top: 60px;
      margin-top: 150px;
    }
    button{
      margin: 15px;
      font-size: 16px;
    }
    #result{
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 25px;
    }
  </style>
</head>
<body>
  <div class="box">
    <p id="result"></p>
    <button onclick="start()">start the timer</button>
    <button onclick="stop()">Stop the timer</button>
    <button onclick="reset()">Reset the timer</button>
  </div>
  <script>
    let second=0;
    let timer;
    function start(){
    timer=setInterval(()=>{
      second++;
      let min=Math.floor(second/60);
      let sec=second%60;
      document.getElementById("result").innerHTML=min + ":" + sec;
    },1000);
    }
    function stop(){
      clearInterval(timer);
    }
    function reset(){
      clearInterval(timer);
      second=0;
      document.getElementById("result").innerHTML="00:00";
    }
  </script>
</body>
</html>
