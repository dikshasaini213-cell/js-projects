<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box{
      border: 2px black solid;
      border-radius: 20px;
      height: 250px;
      width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-self: center;
      padding-top: 60px;
      padding-bottom: 30px;
      margin-top: 150px;
    }
    #result{
      height: 150px;
      width: 150px;
      border: 2px black solid;
      border-radius: 50%;
      margin-top: 35px;
    }
    button{
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="box">
  <button onclick="color()">Random color</button>
  <div id="result"></div>
  </div>
  <script>
    function color(){
      let code="123456789ABCDEF";
      let colour="#";
      for(let i=0;i<6;i++){
        let random=Math.floor(Math.random()*code.length);
        colour+=code[random];
      }
      document.getElementById("result").style.backgroundColor=colour;
    }
  </script>
</body>
</html>
